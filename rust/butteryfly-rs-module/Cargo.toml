[package]
name = "butteryfly-rs-module"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bitvec = "1.0.1"
build-time = "0.1.3"
godot = { version = "0.3.5", features = ["experimental-threads"] }
netcode-rs = "1.4.0"
opus = "0.3.1"

[profile.dev]
debug = "line-tables-only"
lto = "off"

[profile.release]
strip = "debuginfo"
lto = "thin"
# todo: test different values here
codegen-units = 16

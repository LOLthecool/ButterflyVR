[package]
name = "godot-lru-rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]  # Compile this crate to a dynamic C library.

[dependencies]
godot = "0.4.5"
moka = { version = "0.12.13", features = ["sync"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = "1.21.0"

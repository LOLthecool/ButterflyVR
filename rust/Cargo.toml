[workspace]
resolver = "3"
members = ["agones-godot-rs", "netnodes", "godot-lru-rust", "godot-pass", "godot-rust-queue", "godot-rust-zstd"]

[profile.dev]
debug = "line-tables-only"
lto = "off"

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[profile.ci]
inherits = "release"
opt-level = "z"
strip = "symbols"
lto = false
panic = "abort"
incremental = true
codegen-units = 256

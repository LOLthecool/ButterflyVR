[workspace]
resolver = "3"
members = ["agones-godot-rs", "netnodes", "godot-lru-rust", "godot-pass", "godot-rust-queue"]

[profile.dev]
debug = "line-tables-only"
lto = "off"

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[profile.dev.package.godot-pass]
opt-level = 3
debug = false
strip = "debuginfo"
incremental = false
codegen-units = 1

[profile.release.package.godot-pass]
opt-level = 3
debug = false
codegen-units = 1

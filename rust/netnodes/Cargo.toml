[package]
name = "netnodes"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bitvec = "1.1.1"
boring = "5.6.0"
bytes = "1.12.2"
godot = { version = "0.5.6", features = ["register-docs"] }
quiche = { version = "0.30.1", features = ["boringssl-boring-crate", "qlog"], default-features = false }
rand = "0.10.4"
ring = "0.17.14"

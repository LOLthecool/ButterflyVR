[package]
name = "netnodes"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bitvec = "1.0.1"
boring = "4.22.0"
bytes = "1.11.1"
godot = { version = "0.5.2", features = ["register-docs"] }
quiche = { version = "0.28.0", features = ["boringssl-boring-crate", "qlog"], default-features = false }
rand = "0.10.1"
ring = "0.17.14"
